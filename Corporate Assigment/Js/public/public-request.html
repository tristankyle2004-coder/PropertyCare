<!-- public/request.html
     Request detail page.
     Shows the selected request and uploaded photos.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Request Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="mb-0">Request Details</h1>
      <a class="btn btn-outline-secondary" href="/index.html">Back</a>
    </div>

    <div id="requestDetail"></div>
  </main>

  <script>
    function requireAuth() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/login.html";
        return false;
      }
      return true;
    }

    function priorityClass(priority) {
      if (priority === "high") return "bg-danger";
      if (priority === "medium") return "bg-warning text-dark";
      return "bg-success";
    }

    function escapeHtml(s) {
      if (!s && s !== 0) return "";
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[c]));
    }

    async function loadRequest() {
      if (!requireAuth()) return;

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        document.getElementById("requestDetail").innerHTML =
          '<div class="alert alert-danger">No request ID provided.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/requests/${id}`, {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token")
          }
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: "Request not found" }));
          document.getElementById("requestDetail").innerHTML =
            `<div class="alert alert-danger">${escapeHtml(err.error || "Request not found")}</div>`;
          return;
        }

        const payload = await res.json();
        const r = payload.data || payload;

        const photos = (r.Photos || []).map(photo =>
          `<img src="${photo.imageUrl}" class="img-fluid rounded me-2 mb-2" style="max-width:220px;" alt="Request image">`
        ).join("") || '<div class="text-muted">No photos uploaded</div>';

        document.getElementById("requestDetail").innerHTML = `
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">${escapeHtml(r.title)}</h3>
                <span class="badge ${priorityClass(r.priority)}">${escapeHtml(r.priority || "low")}</span>
              </div>

              <p><strong>Status:</strong> <span class="badge bg-info text-dark">${escapeHtml(r.status || "open")}</span></p>
              <p><strong>Property:</strong> ${escapeHtml(r.Property?.name || "Unknown property")}</p>
              <p><strong>Tenant:</strong> ${escapeHtml(r.tenant?.name || "—")}</p>
              <p><strong>Worker:</strong> ${escapeHtml(r.worker?.name || "—")}</p>

              <h5>Description</h5>
              <p>${escapeHtml(r.description || "")}</p>

              <h5>Photos</h5>
              <div class="d-flex flex-wrap">${photos}</div>
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById("requestDetail").innerHTML =
          '<div class="alert alert-danger">Unable to load request details.</div>';
      }
    }

    window.addEventListener("load", loadRequest);
  </script>
</body>
</html>
