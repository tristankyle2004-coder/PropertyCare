<!-- public/login.html
     Login page.
     Allows the user to authenticate before viewing protected pages.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PropertyCare Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="mb-4 text-center">Welcome to PropertyCare</h2>

            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="form-control"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control"
                  autocomplete="current-password"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div id="loginMessage" class="mt-3" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("loginMessage");

      message.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          message.innerHTML =
            `<div class="alert alert-danger">${data.error || "Login failed"}</div>`;
          return;
        }

        localStorage.setItem("token", data.token);
        window.location.href = "/index.html";
      } catch (error) {
        message.innerHTML =
          '<div class="alert alert-danger">Unable to connect to the server.</div>';
      }
    });
  </script>
</body>
</html>
