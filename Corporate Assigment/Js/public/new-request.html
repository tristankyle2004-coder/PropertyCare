<!-- public/new-request.html
     Create maintenance request page.
     Allows a tenant to create a request with optional photos.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Maintenance Request</title>
  <body class="bg-light">
  <main class="container py-4">
    <header class="page-heading mb-4">
      <div>
        <p class="page-eyebrow mb-1">PROPERTYCARE · MAINTENANCE</p>
        <h1 class="mb-2">Create Maintenance Request</h1>
        <p class="page-intro mb-0">
          Tell us what needs attention. Add photos to help explain the issue.
        </p>
      </div>
      <a class="btn btn-outline-secondary" href="/index.html">Back to dashboard</a>
    </header>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">

    
    </div>

    <form id="requestForm" class="card p-4 shadow-sm border-0" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Property</label>
        <select id="property" class="form-select" name="propertyId" required></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4" required></textarea>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <input name="category" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Priority</label>
          <select name="priority" class="form-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Photos</label>
        <input name="photos" id="photos" type="file" class="form-control" multiple accept="image/*">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Submit</button>
        <a class="btn btn-outline-secondary" href="/index.html">Cancel</a>
      </div>

      <div id="message" class="mt-3"></div>
    </form>
  </main>

  <script>
    function requireAuth() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/login.html";
        return false;
      }
      return true;
    }

    function escapeHtml(s) {
      if (!s && s !== 0) return "";
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[c]));
    }

    async function loadProperties() {
      if (!requireAuth()) return;

      try {
        const res = await fetch("/api/properties", {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token")
          }
        });

        if (!res.ok) {
          document.getElementById("message").innerHTML =
            '<div class="alert alert-danger">Could not load properties.</div>';
          return;
        }

        const props = await res.json();
        const sel = document.getElementById("property");

        sel.innerHTML = props.map(p =>
          `<option value="${p.id}">${escapeHtml(p.name)} — ${escapeHtml(p.address || "")}</option>`
        ).join("");
      } catch (err) {
        document.getElementById("message").innerHTML =
          '<div class="alert alert-danger">Unable to load properties.</div>';
      }
    }

    async function submitForm(e) {
      e.preventDefault();

      if (!requireAuth()) return;

      const form = document.getElementById("requestForm");
      const fd = new FormData(form);

      const files = document.getElementById("photos").files;
      for (let i = 0; i < files.length; i++) {
        fd.append("photos", files[i]);
      }

      try {
        const res = await fetch("/api/requests", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token")
          },
          body: fd
        });

        const msg = document.getElementById("message");

        if (res.ok) {
          msg.innerHTML = '<div class="alert alert-success">Request created successfully.</div>';
          form.reset();
          return;
        }

        const err = await res.json().catch(() => ({ message: "Server error" }));
        msg.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.error || err.message || "Error")}</div>`;
      } catch (err) {
        document.getElementById("message").innerHTML =
          '<div class="alert alert-danger">Unable to submit request.</div>';
      }
    }

    document.getElementById("requestForm").addEventListener("submit", submitForm);
    window.addEventListener("load", loadProperties);
  </script>
</body>
</html>
